<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Championship Manager - API Client</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
    <header class="header">
        <div class="header__brand">
            <span>Gerenciador de Campeonatos</span>
        </div>
        <nav class="header__nav">
            <button id="logout-button" class="btn btn--secondary btn--small" style="display: none;">Sair</button>
        </nav>
    </header>

    <main class="container">
        <!-- Seção de Login (visível por padrão) -->
        <section id="login-section" class="form-container">
            <h1 class="page-header__title">Login</h1>
            <p>Acesse sua conta para gerenciar equipes e campeonatos.</p>
            <div id="login-error" class="alert alert--error" style="display: none;"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required value="api.user@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required value="password123">
                </div>
                <div class="form-actions">
                    <button class="btn btn--primary" type="submit">Entrar</button>
                </div>
            </form>
        </section>

        <!-- Seção do Dashboard (oculta por padrão) -->
        <section id="dashboard-section" style="display: none;">
            <div class="page-header">
                <h1 class="page-header__title">Dashboard</h1>
            </div>
            <div class="data-grid">
                <div class="card">
                    <div class="card__header">
                        <h3>Suas Equipes Recentes</h3>
                    </div>
                    <div id="teams-container" class="card__body">
                        <p>Carregando...</p>
                    </div>
                    <div class="card__footer">
                        <a class="btn btn--primary" href="#">+ Nova Equipe</a>
                    </div>
                </div>
                <div class="card">
                    <div class="card__header">
                        <h3>Seus Campeonatos Recentes</h3>
                    </div>
                    <div id="championships-container" class="card__body">
                        <p>Carregando...</p>
                    </div>
                    <div class="card__footer">
                        <a class="btn btn--secondary" href="#">+ Novo Campeonato</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
